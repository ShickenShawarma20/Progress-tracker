name: Daily Progress Tracker

on:
  schedule:
    # Runs every day at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write
env:
     FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update progress tracker
        run: |
          DATE=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          DATETIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
          WEEK=$(TZ='Asia/Kolkata' date '+%V')
          YEAR=$(TZ='Asia/Kolkata' date '+%Y')
          DAY_OF_YEAR=$(TZ='Asia/Kolkata' date '+%j')

          # Create progress directory if it doesn't exist
          mkdir -p progress

          # ── Daily log entry ──────────────────────────────────────────────
          DAILY_FILE="progress/daily-log.md"

          if [ ! -f "$DAILY_FILE" ]; then
            echo "# Daily Progress Log" > "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
            echo "Auto-updated every day. Track your journey here." >> "$DAILY_FILE"
            echo "" >> "$DAILY_FILE"
          fi

          # Append today's entry (avoids duplicate if run twice)
          if ! grep -q "## $DATE" "$DAILY_FILE"; then
            echo "" >> "$DAILY_FILE"
            echo "## $DATE" >> "$DAILY_FILE"
            echo "- Day $DAY_OF_YEAR of $YEAR | Week $WEEK" >> "$DAILY_FILE"
            echo "- Status: Active ✅" >> "$DAILY_FILE"
            echo "- Notes: _(edit this to add your own notes)_" >> "$DAILY_FILE"
          fi

          # ── Weekly summary file ──────────────────────────────────────────
          WEEKLY_FILE="progress/week-$YEAR-W$WEEK.md"

          if [ ! -f "$WEEKLY_FILE" ]; then
            echo "# Week $WEEK — $YEAR" > "$WEEKLY_FILE"
            echo "" >> "$WEEKLY_FILE"
            echo "| Day | Status | Notes |" >> "$WEEKLY_FILE"
            echo "|-----|--------|-------|" >> "$WEEKLY_FILE"
          fi

          DAY_NAME=$(TZ='Asia/Kolkata' date '+%A')
          if ! grep -q "$DATE" "$WEEKLY_FILE"; then
            echo "| $DAY_NAME ($DATE) | ✅ Active | — |" >> "$WEEKLY_FILE"
          fi

          # ── Stats file ───────────────────────────────────────────────────
          STATS_FILE="progress/stats.md"
          TOTAL=$(grep -c "^## 20" "$DAILY_FILE" 2>/dev/null || echo "1")
          STREAK_FILE="progress/.streak"

          # Simple streak counter
          YESTERDAY=$(TZ='Asia/Kolkata' date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null || \
                      TZ='Asia/Kolkata' date -v-1d '+%Y-%m-%d')

          if [ -f "$STREAK_FILE" ]; then
            LAST_DATE=$(cat "$STREAK_FILE" | head -1)
            STREAK=$(cat "$STREAK_FILE" | tail -1)
            if [ "$LAST_DATE" = "$YESTERDAY" ]; then
              STREAK=$((STREAK + 1))
            elif [ "$LAST_DATE" != "$DATE" ]; then
              STREAK=1
            fi
          else
            STREAK=1
          fi

          echo "$DATE" > "$STREAK_FILE"
          echo "$STREAK" >> "$STREAK_FILE"

          cat > "$STATS_FILE" <<EOF
          # Progress Stats

          > Last updated: $DATETIME

          | Metric | Value |
          |--------|-------|
          | Current streak | 🔥 $STREAK day(s) |
          | Total active days | 📅 $TOTAL |
          | Current week | 📆 Week $WEEK, $YEAR |
          | Last recorded | 🕘 $DATETIME |

          _This file is auto-generated by the Daily Progress Tracker workflow._
          EOF

          # ── README badge update ──────────────────────────────────────────
          if [ ! -f "README.md" ]; then
            cat > "README.md" <<EOF
          # My Progress Tracker 🚀

          ![Streak](https://img.shields.io/badge/streak-${STREAK}%20days-orange)
          ![Days](https://img.shields.io/badge/active%20days-${TOTAL}-blue)

          This repository tracks my daily coding activity automatically.

          See [progress/daily-log.md](progress/daily-log.md) for the full log.
          EOF
          else
            # Update streak badge in existing README
            sed -i "s|streak-[0-9]*%20days|streak-${STREAK}%20days|g" README.md
            sed -i "s|active%20days-[0-9]*|active%20days-${TOTAL}|g" README.md
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: daily progress update $(TZ='Asia/Kolkata' date '+%Y-%m-%d')"
          git push
